">

  </nav>
    <div class="img-back">

            <img src="images/Logo-Khobkhun Massage1.png" class="logo">
            </div>
    </div>

<!-- LOGIN -->

<div id="login-zone" class="login-overlay">
    <div style="width:300px;background:#1a1a1a;padding:20px;border:1px solid #ffbe4d;border-radius:10px;text-align:center;">

        <h2 style="color:#ffbe4d;">Admin Login</h2>

        <!-- INPUT + EYE ICON WRAPPER -->
        <div style="position:relative; width:100%;">
            <input 
                type="password" 
                id="admin-pass" 
                placeholder="Password"
                style="
                    width:100%;
                    margin:15px 0;
                    padding:10px 40px 10px 10px;
                    box-sizing:border-box;
                "
            >

            <span 
                onclick="togglePassword()" 
                id="toggle-text"
                style="
                    position:absolute;
                    right:12px;
                    top:50%;

                "
            >
                👁️
            </span>
        </div>

        <button class="view-btn" onclick="login()" style="width:100%;">
            Login
        </button>

    </div>
</div>

<div id="dashboard" class="admin-wrapper">

<!-- WEEK -->

<div class="management-card">
    <h3 style="color:#ffbe4d;">Weekly Status</h3>
    <div id="days-container"></div>
</div>

<!-- DAILY -->

<div class="management-card">
    <h3 style="color:#ffbe4d;">Daily Slots</h3>

<div style="display:flex;flex-wrap:wrap;gap:10px;">
    <input type="text" id="calendar-picker" placeholder="Select Date"
        style="flex:1;background:#111;color:#fff;padding:10px;border:1px solid #b08b38;">
    <button class="view-btn" onclick="loadSchedule()">View</button>
</div>

<button class="view-btn" onclick="closeSelectedDate()">Close This Day</button>
<button class="view-btn" onclick="openSelectedDate()">Reopen This Day</button>

<div class="table-wrapper">
    <table id="schedule-table" style="display:none;">
        <thead>
            <tr>
                <th>Time</th>
                <th>Status</th>
                <th>Details</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="slot-list"></tbody>
    </table>
</div>

<button id="save-btn" class="view-btn" style="display:none;" onclick="saveSlots()">Save Changes</button>


</div>

<!-- 📅 CALENDAR -->

    <h3 style="color:#ffbe4d;">Booking Calendar</h3>
    <div id="calendar"></div>

<script>
const hamBtn = document.getElementById("hamBtn");
const sideMenu = document.getElementById("sideMenu");
let uiBlockedSlots = [];
let currentData = null;
let calendar;

flatpickr("#calendar-picker", { dateFormat: "Y-m-d" });

function showModal(title, message, onConfirm) {
    const modal = document.getElementById("modal");
    const titleEl = document.getElementById("modal-title");
    const msgEl = document.getElementById("modal-message");
    const cancelBtn = document.getElementById("modal-cancel");
    const okBtn = document.getElementById("modal-confirm");

    titleEl.innerText = title;
    msgEl.innerText = message;

    modal.style.display = "flex";

    cancelBtn.onclick = () => {
        modal.style.display = "none";
    };

    okBtn.onclick = () => {
        modal.style.display = "none";
        if (onConfirm) onConfirm();
    };
}
  /* ================= BURGER MENU ================= */
  if (hamBtn) {
    hamBtn.addEventListener("click", () => {
      hamBtn.classList.toggle("active");
      sideMenu.classList.toggle("open");
    });
  }
/* LOGIN */
async function login() {
    const res = await fetch('/admin/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'include',
        body:JSON.stringify({ password: document.getElementById('admin-pass').value })
    });

    if(res.ok){
        document.getElementById('login-zone').style.display='none';
        document.getElementById('dashboard').style.display='block';

        setTimeout(()=>{
            loadWeek();
            loadCalendar();
        },100);
    } else showModal("Access Denied", "Wrong password. Please try again.");;
}
function togglePassword() {
    const input = document.getElementById("admin-pass");
    const icon = document.getElementById("toggle-text");

    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁️";
    }
}
/* WEEK */
async function loadWeek(){
    const res = await fetch('/admin/data',{credentials:'include'});
    const data = await res.json();

    const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    document.getElementById('days-container').innerHTML =
        days.map((d,i)=>`
            <button onclick="toggleDay(${i})"
                style="margin:5px;padding:10px;background:${data.businessHours[i]?'#b08b38':'#333'};color:white;">
                ${d}: ${data.businessHours[i]?'OPEN':'CLOSED'}
            </button>`).join('');
}

/* LOAD DAY */
async function loadSchedule(){
    const date=document.getElementById('calendar-picker').value;
    if(!date) return alert("Select date");

    const res=await fetch('/admin/data',{credentials:'include'});
    currentData=await res.json();

    uiBlockedSlots=currentData.manualBlocks
        .filter(m=>m.date===date && typeof m.start==="number")
        .map(m=>m.start);

    renderSlots(date);
}

/* RENDER */
function renderSlots(date){
    const list=document.getElementById('slot-list');
    list.innerHTML="";

    const closed=currentData.manualBlocks.some(m=>m.date===date && m.fullDay);

    if(closed){
        list.innerHTML="<tr><td colspan='4' style='color:red;text-align:center;'>DAY CLOSED</td></tr>";
        document.getElementById('schedule-table').style.display="table";
        return;
    }

    const hours=currentData.businessHours[new Date(date).getDay()];

    if(!hours){
        list.innerHTML="<tr><td colspan='4'>STORE CLOSED</td></tr>";
    }else{
        for(let t=hours.open;t<hours.close;t+=0.5){

            const timeStr=`${Math.floor(t)}:${t%1===0?'00':'30'}`;

            const booking=currentData.bookings.find(b=>
                b.date===date &&
                b.start<=t &&
                (b.start+b.blocks*0.5)>t
            );

            const tr=document.createElement('tr');

            if(booking){
                tr.className="slot-booked";
                tr.innerHTML=`
                    <td>${timeStr}</td>
                    <td>BOOKED</td>
                    <td>
                        <b>${booking.customerName||"-"}</b><br>
                        📞 ${booking.phone||"-"}<br>
                        ✉ ${booking.email||"-"}<br>
                        💆 ${booking.service||"-"}
                    </td>
                    <td>
                        <button style="        border:none;
        cursor:pointer;
        font-weight:bold;
        color:white;background:red;padding:10px"
                        onclick="cancelBooking('${date}',${booking.start})">Cancel</button>
                    </td>`;
            }else{
                const blocked=uiBlockedSlots.includes(t);

                tr.innerHTML=`
                    <td>${timeStr}</td>
                    <td>${blocked?'REMOVED':'AVAILABLE'}</td>
                    <td>-</td>
                    <td>
                        <button
    onclick="toggleUI(${t}, ${!blocked})"
    style="
        padding:10px;
        border:none;
        cursor:pointer;
        font-weight:bold;
        color:white;
        background:${blocked ? '#2ecc71' : '#e74c3c'};
    "
>
    ${blocked ? 'Restore' : 'Remove'}
</button>
                    </td>`;
            }

            list.appendChild(tr);
        }
    }

    document.getElementById('schedule-table').style.display="table";
    document.getElementById('save-btn').style.display="block";
}

/* 📅 CALENDAR */
async function loadCalendar(){
    const res=await fetch('/admin/data',{credentials:'include'});
    const data=await res.json();

    const events=data.bookings.map(b=>({
        title:`${b.customerName} (${b.service||''})`,
        start:b.date,
        allDay:true
    }));

    const closed=data.manualBlocks
        .filter(m=>m.fullDay)
        .map(m=>({
            title:"CLOSED",
            start:m.date,
            allDay:true,
            color:"red"
        }));

    if(calendar) calendar.destroy();

    calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{
        initialView:'dayGridMonth',
        height:'auto',
        events:[...events,...closed],

        dateClick:function(info){
            document.getElementById('calendar-picker').value=info.dateStr;
            loadSchedule();
        }
    });

    calendar.render();
}

/* CLOSE DAY */
async function closeSelectedDate(){
    const date=document.getElementById('calendar-picker').value;
    if(!date) return alert("Select date");

    await fetch('/admin/close-date',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'include',
        body:JSON.stringify({date})
    });

    loadSchedule();
    loadCalendar();
}

/* REOPEN */
async function openSelectedDate(){
    const date=document.getElementById('calendar-picker').value;

    await fetch('/admin/save-slots',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'include',
        body:JSON.stringify({date,blockedSlots:[]})
    });

    loadSchedule();
    loadCalendar();
}

/* OTHER */
function toggleUI(t,block){
    if(block) uiBlockedSlots.push(t);
    else uiBlockedSlots=uiBlockedSlots.filter(s=>s!==t);
    renderSlots(document.getElementById('calendar-picker').value);
}

async function saveSlots(){
    const date=document.getElementById('calendar-picker').value;
    await fetch('/admin/save-slots',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'include',
        body:JSON.stringify({date,blockedSlots:uiBlockedSlots})
    });
    loadCalendar();
    showModal("Saved", "Changes have been saved successfully.");;
}

async function toggleDay(idx){
    await fetch('/admin/toggle-closure',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'include',
        body:JSON.stringify({dayIndex:idx})
    });
    loadWeek();
}

async function cancelBooking(date,start){
    if(!confirm("Are you sure?")) return;

    await fetch('/admin/cancel',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials:'include',
        body:JSON.stringify({date,start})
    });

    loadSchedule();
    loadCalendar();
}
</script>
